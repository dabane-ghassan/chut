# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds chut, tests it on a real Android system, and publishes it only if every test passed.
#
#   build    JVM unit tests (engine, statistics, learned model) and the release APK
#   device   an Android 14 emulator: instrumented tests inside the app, then the end-to-end
#            test with real incoming calls (app never opened, force-stopped, killed, rebooted)
#   publish  test build on the "latest-build" pre-release; a release when versionName is new,
#            only if the APK is signed with the chut release key (so updates never break)
#
# The reports always go to the "test-report" pre-release (device-report.txt, build-log.txt, screenshots).
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "scripts/**"
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "fastlane/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      release_signed: ${{ steps.cert.outputs.release_signed }}
    env:
      # The chut release certificate. Obtainium and Android only accept updates signed with it.
      RELEASE_CERT_SHA256: 9b1d2f11b7f27be50c80684aaf930f303d80f61ec14a7dc70ff54dcdabd28e27
      HAS_KEY: ${{ secrets.CHUT_KEYSTORE_BASE64 != '' && secrets.CHUT_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unit tests and release APK
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          {
            echo "== unit tests"; ./gradlew --no-daemon testDebugUnitTest
            echo "== release APK"; ./gradlew --no-daemon assembleRelease
          } 2>&1 | tee build-log.txt
          python3 scripts/junit_summary.py app/build/test-results/testDebugUnitTest | tee -a build-log.txt
          cp app/build/outputs/apk/release/app-release.apk chut.apk

      - name: Sign with the chut release key
        if: env.HAS_KEY == 'true'
        shell: bash
        env:
          KS_B64: ${{ secrets.CHUT_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CHUT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/chut.jks"' EXIT
          b64=$(printf '%s' "$KS_B64" | tr -d ' \r\n\t')
          # Say what is wrong with the secret without printing it.
          echo "CHUT_KEYSTORE_BASE64: ${#b64} characters (expected about 5680), starts like a keystore: $([[ $b64 == MII* ]] && echo yes || echo no)"
          if [[ $b64 =~ [^A-Za-z0-9+/=] ]]; then
            echo "::error::CHUT_KEYSTORE_BASE64 contains characters that are not base64 (label, quotes or other text pasted with it?). Paste only the long value."
            exit 1
          fi
          printf '%s' "$b64" | base64 -d > "$RUNNER_TEMP/chut.jks" || { echo "::error::CHUT_KEYSTORE_BASE64 is not complete base64 (truncated when pasted?)."; exit 1; }
          keytool -list -keystore "$RUNNER_TEMP/chut.jks" -storepass:env KS_PASS >/dev/null 2>&1 || { echo "::error::The keystore did not open with CHUT_KEYSTORE_PASSWORD (wrong password, or a space pasted with it?)."; exit 1; }
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/chut.jks" --ks-key-alias chut \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out chut.apk app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify chut.apk

      - name: Which key signed it?
        id: cert
        shell: bash
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          got=$("$BT/apksigner" verify --print-certs chut.apk | sed -nE 's/.*certificate SHA-256 digest: ([0-9a-f]+).*/\1/p' | head -1)
          echo "signer: $got"
          if [ "$got" = "$RELEASE_CERT_SHA256" ]; then
            echo "release_signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "release_signed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed with the test key, not the chut release key: no release will be published (see BUILDING.md)."
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: chut-apk
          path: chut.apk

      - name: Keep the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: ignore

  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/download-artifact@v4
        with:
          name: chut-apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test on an Android 14 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot
          disable-animations: true
          script: bash scripts/device-tests.sh chut.apk

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-report
          path: |
            device-report.txt
            connected.log
            shots/*.png
          if-no-files-found: ignore

  report:
    # Publishes the reports where they can be read without signing in.
    needs: [build, device]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
        continue-on-error: true
      - name: Summary
        run: |
          {
            echo "build: ${{ needs.build.result }}, device tests: ${{ needs.device.result }}, commit ${GITHUB_SHA::7}"
            echo
            [ -f device-report.txt ] && cat device-report.txt
          } > summary.txt
          cat summary.txt >> "$GITHUB_STEP_SUMMARY"
          [ -f device-report.txt ] || echo "(no device report)" > device-report.txt
          [ -f build-log.txt ] || echo "(no build log)" > build-log.txt
          cp summary.txt test-summary.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: test-report
          name: Test report
          prerelease: true
          make_latest: false
          body: "Reports of the latest CI run (commit ${{ github.sha }}): build ${{ needs.build.result }}, device tests ${{ needs.device.result }}."
          files: |
            test-summary.txt
            device-report.txt
            build-log.txt
            shots/*.png

  publish:
    needs: [build, device]
    env:
      RELEASE_CERT_SHA256: 9b1d2f11b7f27be50c80684aaf930f303d80f61ec14a7dc70ff54dcdabd28e27
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: chut-apk

      - name: Prepare test build
        if: github.ref == 'refs/heads/main'
        run: cp chut.apk chut-test-build.apk

      - name: Publish test build
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest test build
          prerelease: true
          make_latest: false
          files: chut-test-build.apk
          body: |
            Test build of `${{ github.sha }}`, made automatically from the main branch after all tests passed. For everyday use, get the [latest release](https://github.com/${{ github.repository }}/releases/latest).

      - name: Is this a release?
        id: rel
        shell: bash
        run: |
          ver=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle)
          echo "versionName: $ver"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif ! git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: steps.rel.outputs.tag != '' && needs.build.outputs.release_signed == 'true'
        shell: bash
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          code=$(sed -nE 's/^\s*versionCode = ([0-9]+).*/\1/p' app/build.gradle)
          {
            echo "## Nouveautés · What's new"
            echo
            sed 's/^• /- /' "fastlane/metadata/android/fr-FR/changelogs/${code}.txt" 2>/dev/null || true
            echo
            sed 's/^• /- /' "fastlane/metadata/android/en-US/changelogs/${code}.txt" 2>/dev/null || true
            echo
            echo "## Installer · Install"
            echo
            echo "Téléchargez **chut.apk** ci-dessous sur votre téléphone Android (10 ou plus récent), ouvrez-le et autorisez l'installation. Puis, dans chut : **Activer la protection**."
            echo
            echo "Download **chut.apk** below on your Android phone (Android 10+), open it and allow the install. Then in chut: **Turn on protection**."
            echo
            echo "**Obtainium** : ajoutez \`https://github.com/${GITHUB_REPOSITORY}\` pour recevoir les mises à jour automatiquement · add it to get updates automatically."
            echo
            echo "Certificat de signature · Signing certificate (SHA-256): \`${RELEASE_CERT_SHA256}\`"
            echo
            echo "Tested on an Android 14 emulator with real incoming calls before release: see the [test report](https://github.com/${GITHUB_REPOSITORY}/releases/tag/test-report)."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: steps.rel.outputs.tag != '' && needs.build.outputs.release_signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: chut ${{ steps.rel.outputs.tag }}
          body_path: release-notes.md
          # One APK per release, so Obtainium never has to ask which one to install.
          files: chut.apk
          prerelease: false
          make_latest: true
