# SPDX-License-Identifier: GPL-3.0-or-later
#
# Builds the chut APK on GitHub's servers.
# Every change to the app on main publishes a test build (chut-test-build.apk on the
# "latest-build" pre-release); a new versionName in app/build.gradle publishes a release
# with chut.apk, so releases/latest/download/chut.apk is always the newest version.
name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "app/**"
      - "!app/src/main/res/raw/community.csv"   # community updates don't need a new build
      - "gradle/**"
      - "*.gradle"
      - "gradle.properties"
      - "fastlane/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # With these two repository secrets, releases are signed with the chut key (see
      # BUILDING.md). Without them, builds use the committed test key.
      HAS_KEY: ${{ secrets.CHUT_KEYSTORE_BASE64 != '' && secrets.CHUT_KEYSTORE_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@v4
        id: checkout

      - uses: actions/setup-java@v4
        id: java
        with:
          distribution: temurin
          java-version: "17"

      # GitHub's Ubuntu runners ship the Android SDK; the Gradle wrapper fetches Gradle.
      - name: Test and build
        id: build
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          {
            echo "== unit tests"; ./gradlew --no-daemon testDebugUnitTest
            echo "== release APK"; ./gradlew --no-daemon assembleRelease
          } 2>&1 | tee build-log.txt
          cp app/build/outputs/apk/release/app-release.apk chut.apk
          ls -la chut.apk

      - name: Sign with the chut release key
        if: env.HAS_KEY == 'true'
        shell: bash
        env:
          KS_B64: ${{ secrets.CHUT_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.CHUT_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/chut.jks"' EXIT
          printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/chut.jks"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/chut.jks" --ks-key-alias chut \
            --ks-pass env:KS_PASS --key-pass env:KS_PASS \
            --out chut.apk app/build/outputs/apk/release/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs chut.apk > verify.txt
          grep -E "Verifies|certificate (DN|SHA-256)" verify.txt || cat verify.txt

      # On failure, keep the full log on a "ci-log" branch so it can be read with plain git.
      - name: Save the build log
        if: failure()
        shell: bash
        run: |
          {
            echo "== step outcomes"
            echo '${{ toJSON(steps) }}'
            echo "== environment"
            echo "ANDROID_HOME=$ANDROID_HOME"; ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" 2>&1 | head -20
            java -version 2>&1
            echo "== build"
            cat build-log.txt 2>/dev/null || echo "(the build step did not start)"
          } > full-log.txt
          mv full-log.txt build-log.txt
          mkdir -p /tmp/ci-log && cp build-log.txt /tmp/ci-log/
          cd /tmp/ci-log
          git init -q -b ci-log
          git config user.name "chut CI"
          git config user.email "ci@users.noreply.github.com"
          git add build-log.txt
          git commit -qm "Build log for ${GITHUB_SHA::7} (failed)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-log

      # Called chut-test-build.apk so that chut.apk only ever means the latest real release.
      - name: Prepare test build
        if: success() && github.ref == 'refs/heads/main'
        run: cp chut.apk chut-test-build.apk

      - name: Publish test build
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-build
          name: Latest test build
          prerelease: true
          make_latest: false
          files: chut-test-build.apk
          body: |
            Test build of `${{ github.sha }}`, made automatically from the main branch. For everyday use, get the [latest release](https://github.com/${{ github.repository }}/releases/latest).

      # A release is made for a pushed tag, or on main when app/build.gradle has a
      # versionName that has no release yet (bump the version, push, done).
      - name: Is this a release?
        id: rel
        if: success()
        shell: bash
        run: |
          ver=$(sed -nE 's/^\s*versionName = "([^"]+)".*/\1/p' app/build.gradle)
          echo "versionName: $ver"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_REF" == refs/heads/main ]] && ! git ls-remote --exit-code --tags origin "refs/tags/v$ver" >/dev/null; then
            echo "tag=v$ver" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        if: success() && steps.rel.outputs.tag != ''
        shell: bash
        env:
          TAG: ${{ steps.rel.outputs.tag }}
        run: |
          code=$(sed -nE 's/^\s*versionCode = ([0-9]+).*/\1/p' app/build.gradle)
          cp chut.apk "chut-${TAG}.apk"
          {
            echo "## Nouveautés · What's new"
            echo
            sed 's/^• /- /' "fastlane/metadata/android/fr-FR/changelogs/${code}.txt" 2>/dev/null || true
            echo
            sed 's/^• /- /' "fastlane/metadata/android/en-US/changelogs/${code}.txt" 2>/dev/null || true
            echo
            echo "## Installer · Install"
            echo
            echo "Téléchargez **chut.apk** ci-dessous sur votre téléphone Android (10 ou plus récent), ouvrez-le et autorisez l'installation. Puis, dans chut : **Activer la protection**."
            echo
            echo "Download **chut.apk** below on your Android phone (Android 10+), open it and allow the install. Then in chut: **Turn on protection**."
            echo
            echo "Both APKs are the same file. To be told about new versions, use [Obtainium](https://obtainium.imranr.dev/) with the badge in the [README](https://github.com/${GITHUB_REPOSITORY}#readme)."
          } > release-notes.md
          cat release-notes.md

      - name: Publish release
        if: success() && steps.rel.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: chut ${{ steps.rel.outputs.tag }}
          body_path: release-notes.md
          files: |
            chut-${{ steps.rel.outputs.tag }}.apk
            chut.apk
          prerelease: false
          make_latest: true

      - name: Remove an old failure log
        if: success() && github.ref == 'refs/heads/main'
        shell: bash
        run: git push origin --delete ci-log 2>/dev/null || true
