name: Signaler un numéro / Report a number
description: Ajoutez un numéro de démarchage ou d'arnaque à la liste communautaire de chut.
title: "Signalement "
labels: ["report"]
body:
  - type: markdown
    attributes:
      value: |
        Merci ! Ce signalement est **public**. Un robot l'enregistre en quelques secondes ;
        dès que **deux personnes différentes** ont signalé un numéro, il rejoint la liste
        communautaire utilisée par toutes les applis chut.

        *Thanks! This report is public. Once two different people report a number, it joins the community list.*
  - type: input
    id: number
    attributes:
      label: Numéro
      description: "Le numéro qui vous a appelé, par exemple 01 62 43 41 66 ou +33162434166."
      placeholder: "01 62 43 41 66"
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Catégorie
      options:
        - Démarchage
        - Arnaque
        - Pas du spam (retirer de la liste)
      default: 0
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Détails (facultatif)
      description: "Ce que disait l'appel : énergie, CPF, isolation, faux conseiller bancaire… N'écrivez aucune donnée personnelle."
    validations:
      required: false
